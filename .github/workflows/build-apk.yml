name: Build test APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app source (overlay)
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      # Всё "родное" Android/Gradle-обвязку (build.gradle, gradle-wrapper и т.п.) генерирует
      # сам `flutter create` в чистом окружении CI — надёжнее, чем вручную писать эти файлы
      # без возможности локально их проверить. Дальше поверх свежего скелета накладываются
      # только Dart-код (lib/) и зависимости (pubspec.yaml) из этого репозитория.
      - name: Generate fresh Flutter project scaffold
        run: flutter create --platforms=android --org kz.agroaiqyn --project-name agro_jekpe_jek app

      - name: Overlay our app code onto the scaffold
        run: |
          rm -rf app/lib
          cp -r overlay/lib app/lib
          cp overlay/pubspec.yaml app/pubspec.yaml

      - name: Patch AndroidManifest.xml (app name + microphone permission)
        run: |
          MANIFEST=app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="app"/android:label="Agro Jekpe-jek"/' "$MANIFEST"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET"/>#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>#' "$MANIFEST"
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"

      # Пакет vibration (и часть androidx-библиотек, которые он тянет) собран под API 34 —
      # шаблон flutter create по умолчанию ставит compileSdk 33, из-за чего сборка падает
      # ("compiled against android-33" / "requires ... compile against version 34 or later").
      # Патчим явным числом — работает и для Groovy (build.gradle), и для Kotlin DSL
      # (build.gradle.kts), какой бы формат ни сгенерировал flutter create в этой версии.
      - name: Bump compileSdk to satisfy plugin requirements
        run: |
          for f in app/android/app/build.gradle.kts app/android/app/build.gradle; do
            if [ -f "$f" ]; then
              echo "--- before: $f ---"; cat "$f"
              sed -i \
                -e 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 35/' \
                -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/' \
                -e 's/compileSdk flutter\.compileSdkVersion/compileSdk 35/' \
                "$f"
              echo "--- after: $f ---"; cat "$f"
            fi
          done

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agro-jekpe-jek-test-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
