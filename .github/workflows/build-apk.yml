name: Build test APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout app source (overlay)
        uses: actions/checkout@v4
        with:
          path: overlay

      # Каждый CI-запуск — чистая машина без ~/.android/debug.keystore, поэтому Gradle раньше
      # генерировал НОВЫЙ случайный debug-ключ на каждой сборке — Android видит это как другое
      # приложение и отказывается ставить обновление поверх старого ("конфликтует с другим
      # пакетом", жалоба пользователя: обновление ни разу не сработало, приходилось удалять
      # старую версию). Фикс: один и тот же keystore хранится в репозитории (это debug-ключ,
      # не для публикации в Play Store — там нужен отдельный release-ключ, храниться в общем
      # доступе ему нормально) и переиспользуется во всех сборках; если его ещё нет — эта же
      # сборка создаёт его и коммитит обратно, дальше все следующие сборки берут готовый.
      - name: Ensure stable debug keystore (so updates install without uninstalling)
        run: |
          mkdir -p ~/.android
          if [ -f overlay/android-debug.keystore ]; then
            echo "Reusing committed debug keystore"
            cp overlay/android-debug.keystore ~/.android/debug.keystore
          else
            echo "No committed debug keystore yet — generating one and committing it for future builds"
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore overlay/android-debug.keystore
            cd overlay
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android-debug.keystore
            git commit -m "Add stable debug keystore for consistent APK signing across builds [skip ci]"
            git push
            cd ..
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      # Всё "родное" Android/Gradle-обвязку (build.gradle, gradle-wrapper и т.п.) генерирует
      # сам `flutter create` в чистом окружении CI — надёжнее, чем вручную писать эти файлы
      # без возможности локально их проверить. Дальше поверх свежего скелета накладываются
      # только Dart-код (lib/) и зависимости (pubspec.yaml) из этого репозитория.
      - name: Generate fresh Flutter project scaffold
        run: flutter create --platforms=android --org kz.agroaiqyn --project-name agro_jekpe_jek app

      - name: Overlay our app code onto the scaffold
        run: |
          rm -rf app/lib app/assets
          cp -r overlay/lib app/lib
          cp -r overlay/assets app/assets
          cp overlay/pubspec.yaml app/pubspec.yaml

      # <queries> обязателен на Android 11+ (API 30+, package visibility) — без него url_launcher
      # не сможет найти установленный Telegram, чтобы передать ему обычную https-ссылку
      # t.me/bot?start=... (вход/привязка через код+ссылку, см. lib/login_screen.dart,
      # lib/settings_screen.dart) — launchUrl тихо считал бы, что приложения "нет".
      - name: Patch AndroidManifest.xml (app name, permissions, tg:// queries)
        run: |
          MANIFEST=app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="app"/android:label="Agro Jekpe-jek"/' "$MANIFEST"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET"/>#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>#' "$MANIFEST"
          sed -i 's#</manifest>#    <queries>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="tg" /></intent>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>\n    </queries>\n</manifest>#' "$MANIFEST"
          echo "--- AndroidManifest.xml ---"
          cat "$MANIFEST"

      # Несколько плагинов (shared_preferences_android, speech_to_text, webview_flutter_android,
      # vibration) собраны под более новый Android SDK, чем ставит по умолчанию flutter create
      # ("compiled against android-33/35" / "requires ... 36 or later"). Патчим явным числом —
      # работает и для Groovy (build.gradle), и для Kotlin DSL (build.gradle.kts), какой бы
      # формат ни сгенерировал flutter create в этой версии.
      - name: Bump compileSdk to satisfy plugin requirements
        run: |
          for f in app/android/app/build.gradle.kts app/android/app/build.gradle; do
            if [ -f "$f" ]; then
              echo "--- before: $f ---"; cat "$f"
              sed -i \
                -e 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' \
                -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' \
                -e 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/' \
                "$f"
              echo "--- after: $f ---"; cat "$f"
            fi
          done

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Подменяет дефолтную иконку flutter create на реальный логотип приложения — см.
      # flutter_launcher_icons: в pubspec.yaml.
      - name: Generate app launcher icon from logo
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agro-jekpe-jek-test-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
