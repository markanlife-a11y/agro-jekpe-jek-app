name: agro_jekpe_jek
description: "Agro Jekpe-jek — нативное Android-приложение (тестовая сборка) для агро-баттла AgroAiqyn."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.0
  webview_flutter: ^4.7.0
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
