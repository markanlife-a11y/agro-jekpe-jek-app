name: agro_jekpe_jek
description: "Agro Jekpe-jek — нативное Android-приложение (тестовая сборка) для агро-баттла AgroAiqyn."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.0
  permission_handler: ^11.3.0
  audioplayers: ^6.0.0
  url_launcher: ^6.3.0
  auto_size_text: ^3.0.0
  # Запись голосового ответа как настоящего аудио — отправляется в Gemini на бэкенде, а не
  # распознаётся речью на самом устройстве (speech_to_text снят: он и был источником постоянных
  # "голосовой не работает" — на части устройств/прошивок просто немо не запускал listen()).
  record: ^5.1.2
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/

# Иконка приложения на телефоне (значок на рабочем столе/в списке приложений) — по умолчанию
# flutter create подставляет свою дефолтную, пользователь попросил поставить настоящий логотип.
# Генерируется прямо в CI командой `dart run flutter_launcher_icons` перед сборкой (см.
# .github/workflows/build-apk.yml). ВАЖНО: используем logo_icon.png (квадратный, центрированный
# по кругу), а НЕ исходный logo.jpg (1407×768, широкий прямоугольник) — flutter_launcher_icons
# просто растягивает картинку под квадрат иконки без обрезки, поэтому из прямоугольника круг
# выходил овалом (жалоба пользователя). logo_icon.png — квадратный кроп того же логотипа.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_icon.png"
  adaptive_icon_background: "#F4EFE3"
  adaptive_icon_foreground: "assets/images/logo_icon.png"
